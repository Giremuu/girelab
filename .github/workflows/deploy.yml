name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Plus tard : récupérer ici le build web de chaque jeu (Release d'un autre repo)
      # et le copier dans public/games/<slug>/ avant le build Astro.

      - name: Build Astro
        uses: withastro/action@v6

  deploy:
    # Inactif tant que la variable de repo PAGES_ENABLED n'est pas à "true"
    # (Settings → Secrets and variables → Actions → Variables).
    # GitHub Pages nécessite un repo public (ou GitHub Pro pour un repo privé).
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
